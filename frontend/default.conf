server {
    listen 8080; # Yandex Serverless Containers слушают порт 8080 по умолчанию
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проксирование запросов /run/ на локальный FastAPI
    location /run/ {
        proxy_pass http://127.0.0.1:8000/run/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Увеличиваем таймауты для долгих шагов обучения/скачивания (например, до 5 минут)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}